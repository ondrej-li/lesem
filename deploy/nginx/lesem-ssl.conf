# One Let's Encrypt certificate covers lesem.info and www.lesem.info.
ssl_certificate     /etc/letsencrypt/live/lesem.info/fullchain.pem;
ssl_certificate_key /etc/letsencrypt/live/lesem.info/privkey.pem;
include /etc/letsencrypt/options-ssl-nginx.conf;
ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
