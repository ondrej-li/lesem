# Security headers for lesem.info / www.lesem.info.
#
# add_header does not accumulate across levels: a location that sets its own
# header drops everything inherited from the server block, so include this in
# the server block AND in every location that adds Cache-Control.
#
# Deliberately not snippets/security-headers.conf: its CSP assumes
# first-party scripts only, but this site is a static export of a WordPress
# theme that needs inline <script>/style="" plus Google Fonts and the
# FontAwesome CDN. Google Analytics was retired from the export, so no
# analytics origins are allowed any more.
add_header Strict-Transport-Security   "max-age=31536000" always;
add_header X-Content-Type-Options      "nosniff" always;
add_header X-Frame-Options             "SAMEORIGIN" always;
add_header Referrer-Policy             "strict-origin-when-cross-origin" always;
add_header Permissions-Policy          "accelerometer=(), camera=(), geolocation=(), gyroscope=(), magnetometer=(), microphone=(), payment=(), usb=()" always;
add_header Cross-Origin-Opener-Policy  "same-origin" always;
add_header X-Permitted-Cross-Domain-Policies "none" always;
add_header Content-Security-Policy     "default-src 'self'; img-src 'self' data: https:; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://maxcdn.bootstrapcdn.com; script-src 'self' 'unsafe-inline'; worker-src 'self' blob:; font-src 'self' data: https://fonts.gstatic.com https://maxcdn.bootstrapcdn.com; media-src 'self'; connect-src 'self'; frame-src https://calendar.google.com https://www.google.com; object-src 'none'; base-uri 'self'" always;

