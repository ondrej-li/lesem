# lesem.info / www.lesem.info - static catalogue clone of lesem.info.
#
# Web root:  /var/www/lesem   (rsync; no PHP, no database, no backend)
# Headers:   snippets/lesem-headers.conf
# Zones:     conf.d/00-hardening.conf
# TLS:       snippets/lesem-ssl.conf (one cert for both names)
# Versioned copy: deploy/nginx/ in the site repository.

# URLs that search engines still have indexed but that do not exist in the
# export: the WooCommerce cart/checkout/account pages (deliberately dropped)
# and products deleted from the shop before the migration. 301s so visitors
# and crawlers land on the closest surviving page instead of a 404.
map $uri $lesem_redirect {
    default                                                              "";

    /kosik/                                                              /obchod/;
    /kosik                                                               /obchod/;
    /pokladna/                                                           /obchod/;
    /pokladna                                                            /obchod/;
    /muj-ucet/                                                           /obchod/;
    /muj-ucet                                                            /obchod/;

    /kvetinove-predplatne/                                               /obchod/;
    /kvetinove-predplatne                                                /obchod/;
    /kategorie-produktu/vysivane-pohledy-a-zastery/                      /kategorie-produktu/vysivane-zastery/;
    /kategorie-produktu/vysivane-pohledy-a-zastery                       /kategorie-produktu/vysivane-zastery/;

    /produkt/vazba-vencu/                                                /kategorie-produktu/workshopy/;
    /produkt/vazba-vencu                                                 /kategorie-produktu/workshopy/;
    /produkt/cemericove-aranzma-a-vazba-velke-kytice-mdz-od-13-30-h/     /kategorie-produktu/workshopy/;
    /produkt/cemericove-aranzma-a-vazba-velke-kytice-mdz-od-13-30-h      /kategorie-produktu/workshopy/;

    /produkt/vysivana-oversize-taska-limited-edition-yojogayo/            /kategorie-produktu/vysivane-sacky/;
    /produkt/vysivana-oversize-taska-limited-edition-yojogayo             /kategorie-produktu/vysivane-sacky/;
    /produkt/vysivana-zastera-sleva-30/                                  /kategorie-produktu/vysivane-zastery/;
    /produkt/vysivana-zastera-sleva-30                                   /kategorie-produktu/vysivane-zastery/;
    /produkt/vysivana-zastera-sleva-40/                                  /kategorie-produktu/vysivane-zastery/;
    /produkt/vysivana-zastera-sleva-40                                   /kategorie-produktu/vysivane-zastery/;
    /produkt/vysivana-zastera-sleva-40-2/                                /kategorie-produktu/vysivane-zastery/;
    /produkt/vysivana-zastera-sleva-40-2                                 /kategorie-produktu/vysivane-zastery/;
    /produkt/vysivana-zastera-sleva-40-detska/                           /kategorie-produktu/vysivane-zastery/;
    /produkt/vysivana-zastera-sleva-40-detska                            /kategorie-produktu/vysivane-zastery/;
    /produkt/vysivany-ubrus-maly/                                        /kategorie-produktu/lnene-ubrusy/;
    /produkt/vysivany-ubrus-maly                                         /kategorie-produktu/lnene-ubrusy/;

    /events/page/2/                                                      /events/;
    /events/page/2                                                       /events/;
}

# --- HTTP: ACME stays reachable, everything else goes to HTTPS ---

server {
    listen 80;
    listen [::]:80;
    server_name lesem.info;

    location /.well-known/acme-challenge/ {
        root /var/www/lesem;
        default_type text/plain;
    }

    # Canonical host is www, matching the site's canonical tags.
    location / {
        return 301 https://www.lesem.info$request_uri;
    }
}

server {
    listen 80;
    listen [::]:80;
    server_name www.lesem.info;

    location /.well-known/acme-challenge/ {
        root /var/www/lesem;
        default_type text/plain;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# --- HTTPS ---

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name lesem.info;
    include snippets/methods-read-only.conf;
    include snippets/block-scanner-paths.conf;

    include snippets/lesem-ssl.conf;

    return 301 https://www.lesem.info$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name www.lesem.info;
    include snippets/methods-read-only.conf;
    include snippets/block-scanner-paths.conf;

    include snippets/lesem-ssl.conf;

    root /var/www/lesem;
    index index.html;
    charset utf-8;
    server_tokens off;

    include snippets/lesem-headers.conf;

    access_log /var/log/nginx/lesem.access.log;
    error_log  /var/log/nginx/lesem.error.log;

    # Retired shop URLs (see the map at the top of this file).
    if ($lesem_redirect) {
        return 301 $lesem_redirect;
    }

    error_page 404 /404.html;

    # Methods and scanner paths come from snippets/methods-read-only.conf and
    # snippets/block-scanner-paths.conf, installed from the vps repo.

    # nginx's built-in gzip_types is text/html only, which would leave all of
    # the CSS/JS/SVG uncompressed.
    gzip_types text/css text/plain application/javascript application/json
               application/xml image/svg+xml;


    # NOTE: /wp-content/ and /wp-includes/ are served on purpose - the export
    # keeps WordPress asset paths so it matches the original site exactly.
    location / {
        include snippets/lesem-headers.conf;
        limit_conn perip_conn 25;
        limit_req  zone=web_general burst=25 nodelay;
        try_files  $uri $uri.html $uri/ =404;
    }

    # Pages are revalidated so a deploy is visible immediately.
    location ~* \.html$ {
        include snippets/lesem-headers.conf;
        limit_req zone=web_general burst=25 nodelay;
        add_header Cache-Control "no-cache, must-revalidate" always;
    }

    # Assets keep their WordPress filenames (there is no content hash in the
    # URL), so a week rather than immutable: a replaced photo still updates.
    # A single page load fans out to ~150 of these, hence the wide burst.
    location ~* \.(css|js|webp|jpe?g|png|gif|svg|ico|woff2?|ttf|eot|otf|mov|mp4|pdf)$ {
        include snippets/lesem-headers.conf;
        limit_req zone=web_assets burst=200 nodelay;
        add_header Cache-Control "public, max-age=604800" always;
    }

    location = /favicon.ico {
        log_not_found off;
        access_log off;
    }

    # Branded 404 page; only reachable through error_page.
    location = /404.html {
        internal;
        include snippets/lesem-headers.conf;
        add_header Cache-Control "no-store" always;
    }

    # Private visit report generated from the access logs by the
    # lesem-stats.timer unit. Lives outside the web root so deploys never
    # touch it. GoAccess writes inline styles/scripts, so this location
    # deliberately opts out of the site CSP. `^~` keeps the .html regex
    # location from capturing /_stats/index.html.
    location ^~ /_stats/ {
        alias /var/www/lesem-stats/;
        index index.html;
        autoindex off;
        auth_basic           "lesem.info stats";
        auth_basic_user_file /etc/nginx/lesem-stats.htpasswd;
        add_header X-Robots-Tag "noindex, nofollow" always;
        add_header Cache-Control "no-store" always;
    }
}
